# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.
#
# Pushing a tag starting with "v" (e.g. v1.0.0) also publishes a GitHub Release
# with the built jars. The version is taken from the tag (v1.0.0 -> 1.0.0),
# overriding the version in gradle.properties.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.1
      - name: setup jdk
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew build -Pversion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew build
          fi
      - name: capture build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Artifacts
          path: build/libs/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: Artifacts
          path: build/libs/
      - name: create github release
        uses: softprops/action-gh-release@v3.0.4
        with:
          name: WynnAnimated FPM Compat ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
